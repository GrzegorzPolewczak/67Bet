name: PR Checks - Run Tests

on:
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x' 

      - name: Restore dependencies
        run: dotnet restore tests/67Bet.UnitTests/67Bet.UnitTests.csproj

      - name: Build
        run: dotnet build tests/67Bet.UnitTests/67Bet.UnitTests.csproj --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test tests/67Bet.UnitTests/67Bet.UnitTests.csproj --configuration Release --no-build --verbosity normal
