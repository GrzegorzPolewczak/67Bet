name: Deploy Frontend to Azure Web App

on:
  push:
    branches: [ "main" ]
    paths: [ "67Bet.Frontend/**", ".github/workflows/deploy-frontend.yml" ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: '67bet-frontend' # Upewnij się, że to nazwa Twojego App Service na Azure
  WORKING_DIRECTORY: '67Bet.Frontend'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './67Bet.Frontend/package-lock.json'

      - name: Install dependencies
        run: npm install
        working-directory: ${{ env.WORKING_DIRECTORY }}

      - name: Build
        run: npm run build
        working-directory: ${{ env.WORKING_DIRECTORY }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_FRONTEND }}
          package: ./${{ env.WORKING_DIRECTORY }}/dist
