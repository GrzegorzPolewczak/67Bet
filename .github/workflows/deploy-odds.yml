name: Deploy Odds API
on:
  push:
    branches: [ "main" ]
    paths: [ "src/Services/Odds/**", ".github/workflows/deploy-odds.yml" ]
  workflow_dispatch:
env:
  AZURE_WEBAPP_NAME: '67bet-odds-api'
  PROJECT_PATH: 'src/Services/Odds/67Bet.Odds.Api/67Bet.Odds.Api.csproj'
jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      
      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}
      
      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore
      
      - name: Test
        run: dotnet test tests/67Bet.UnitTests/67Bet.UnitTests.csproj --filter OddsIntegrationServiceTests --no-build --verbosity normal
      
      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef
      
      - name: Apply Migrations
        run: |
          dotnet ef database update --project src/Services/Odds/67Bet.Odds.Infrastructure --startup-project src/Services/Odds/67Bet.Odds.Api
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.AZURE_MYSQL_CONNECTION_STRING_ODDS }}

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -o ./publish_output
      
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_ODDS }}
          package: ./publish_output
