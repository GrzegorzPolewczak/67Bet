name: Deploy Betting API
on:
  push:
    branches: [ "main" ]
    paths: [ "src/Services/Betting/**", ".github/workflows/deploy-betting.yml" ]
  workflow_dispatch:
env:
  AZURE_WEBAPP_NAME: '67bet-betting-api'
  PROJECT_PATH: 'src/Services/Betting/67Bet.Betting.Api/67Bet.Betting.Api.csproj'
  INFRA_PATH: 'src/Services/Betting/67Bet.Betting.Infrastructure'
jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      
      - name: Restore dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}
      
      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore
      
      - name: Apply Migrations (Smart Check)
        run: |
          if [ -d "${{ env.INFRA_PATH }}/Migrations" ]; then
            echo "Migrations directory found. Installing tools and updating database..."
            dotnet tool install --global dotnet-ef
            dotnet ef database update --project ${{ env.INFRA_PATH }} --startup-project ${{ env.PROJECT_PATH }}
          else
            echo "No Migrations directory found. Skipping database update."
          fi
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.AZURE_MYSQL_CONNECTION_STRING_BETTING }}

      - name: Publish
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release -o ./publish_output
      
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_BETTING }}
          package: ./publish_output
